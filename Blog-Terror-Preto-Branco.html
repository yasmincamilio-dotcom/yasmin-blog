do. 'No projeto original havia um 12º andar. Foi embargado depois que um operário caiu da viga ainda com cimento fresco. O corpo nunca foi retirado, só concretado.' Ele me mostrou a planta, com um X a lápis em cima do meu teto.","Na quinta noite, gravei. Coloquei o celular no teto. Quando ouvi de manhã, não eram só passos. Havia respiração. E depois, bem baixinho, alguém sussurrando meu nome. Meu nome completo, que ninguém no prédio sabia.","Na última gravação, às 3:07, o arrastar para. Um baque surdo. Depois, silêncio. Depois, arranhões vindo de dentro do gesso, descendo pela parede em direção à minha cama."]},{id:"porao",title:"Sussurros no Porão",date:"1972",tag:"LENDA URBANA",sinopse:"Três irmãs brincavam de rádio no porão. O rádio estava desplugado há 12 anos.",local:"Pelotas, RS - Chácara dos Antunes",testemunhas:"Família Antunes",conteudo:["O porão era proibido. Meu avô lacrou a porta em 1960 depois que a luz começou a acender sozinha. Minha mãe disse que era infiltração nos fios. Nós, crianças, achamos a chave dentro de um pote de banha.","Lá embaixo havia um rádio Philco gigante, coberto com um lençol. Minha irmã Lúcia girou o botão. Chiar. Depois, vozes. Muitas crianças falando ao mesmo tempo, recitando nomes. O fio do rádio estava cortado e enrolado a um metro da tomada.","A voz mais alta disse: 'Vocês três. Faltam três.' Contamos. Éramos três. Perguntamos quem estava falando. A resposta foi imediata: 'As que ficaram aqui quando o avô trancou.'","Subimos correndo. Quando meu pai desceu com uma lanterna, o rádio não estava mais lá. No lugar, três bonecas de pano sentadas, com nossos nomes escritos a carvão na testa. Bonecas que nunca tínhamos visto antes."]},{id:"fita",title:"A Última Fita",date:"1999",tag:"ARQUIVO",sinopse:"Uma fita VHS sem etiqueta chegou pelo correio. Só estava escrito: NÃO ASSISTA SOZINHO.",local:"Porto Alegre, RS - Arquivo da TV Piratini",testemunhas:"Arquivista J. C.",conteudo:["Trabalho no arquivo morto. A fita veio numa caixa parda, sem remetente. Coloquei no videocassete da sala 3, que ninguém usa. Primeiro, estática. Depois, uma sala vazia, idêntica à minha sala de arquivo, filmada de um canto alto.","Na gravação, eu entrava na sala. Mas eu estava assistindo à fita, não dentro dela. O eu da fita sentava, colocava uma fita no videocassete e começava a assistir. Era um loop. E cada loop, a câmera da fita ficava um pouco mais perto.","No quarto loop, o eu da fita olhou direto para a câmera. E sorriu. Um sorriso que eu nunca dei. Depois levantou e caminhou até a lente, até o rosto ocupar a tela inteira. Ele sussurrou: 'Agora é a sua vez de gravar.'","A fita acabou. A luz da sala 3 piscou. Quando olhei para a porta, havia marcas de mãos úmidas por dentro, como se alguém tivesse acabado de sair. O videocassete ejetou sozinho. Dentro dele, havia outra fita. Ainda quente."]},{id:"espelho",title:"O Espelho que Não Reflete",date:"1983",tag:"RELATO REAL",sinopse:"Compraram um espelho de borda dourada num brechó. Nele, o quarto parecia ter uma porta a mais.",local:"Recife, PE - Casa da Torre",testemunhas:"Casal Andrade",conteudo:["O espelho era lindo e barato demais. Alto, com moldura trabalhada. Colocamos no quarto, em frente à cama. Na primeira manhã, minha esposa perguntou por que deixamos a porta do closet aberta. Não deixamos. No reflexo, havia uma porta onde deveria haver parede.","Na segunda noite, acordei às 4 da manhã e vi, pelo espelho, a porta aberta. Do lado de dentro, tudo escuro. Mas havia algo em pé no batente, só o contorno. Não refletia luz.","Minha esposa começou a sonhar com a porta. Disse que atravessava e encontrava uma casa idêntica à nossa, mas sem móveis e com todas as janelas pintadas de preto. Na casa do sonho, havia pessoas nos olhando através do nosso espelho.","Quebramos o espelho com um martelo. Atrás dele, a parede estava oca. Havia uma porta velha, selada com tijolos por dentro. No centro da porta, arranhado na madeira: 'NÃO DEIXE ELES OLHAREM DE VOLTA'. Ainda ouvimos batidas, do outro lado da parede, quando a casa fica em silêncio."]},{id:"madrugada",title:"O Chamado da Madrugada",date:"2005",tag:"LENDA URBANA",sinopse:"Todo dia 3:33, o telefone fixo tocava. Do outro lado, só respiração. Até que atenderam.",local:"Brasília, DF - SQN 308, Bloco G",testemunhas:"Moradores do bloco",conteudo:["O prédio inteiro ouvia. Às 3:33 da manhã, o telefone do hall tocava. O síndico desligou o fio. Continuou tocando. Chamaram a companhia telefônica. Disseram que não havia linha ativa naquele ramal desde 1998.","Uma moradora do 2º andar atendeu. Ficou muda. Desligou. No dia seguinte, mudou-se sem dar explicação. Deixou um bilhete na portaria: 'Não era respiração. Era alguém tentando lembrar como respirar.'","Eu atendi na semana seguinte. Era uma criança. 'Mãe?' ela disse. 'Você me deixou aqui?' A voz vinha com eco, como se falasse de dentro de um poço. Eu não tenho filhos.","Agora meu telefone em casa toca às 3:33. Não tem fio. É meu celular, mesmo no modo avião. Ontem atendi de novo. A criança disse: 'Achei você. Agora vou aí.' Desde então, sinto cheiro de terra molhada no meu quarto, todas as madrugadas."]}];function ai(){let[e,n]=yn.useState(null),[t,r]=yn.useState({}),[l,u]=yn.useState(!1),[o,i]=yn.useState("arquivos"),[a,c]=yn.useState(0);yn.useEffect(()=>{let p={};ii.forEach((y,S)=>{p[y.id]={skull:[47,82,31,56,64,39][S],candle:[12,9,23,14,18,27][S],myVote:null}}),r(p)},[]);let m=(p,y)=>{r((S)=>{let k=S[p];if(!k)return S;if(k.myVote===y)return{...S,[p]:{skull:y==="skull"?k.skull-1:k.skull,candle:y==="candle"?k.candle-1:k.candle,myVote:null}};let{skull:M,candle:f}=k;if(k.myVote==="skull")M--;if(k.myVote==="candle")f--;if(y==="skull")M++;if(y==="candle")f++;return{...S,[p]:{skull:M,candle:f,myVote:y}}})},h=(p)=>{i(p),c((y)=>y+1),u(!1),document.getElementById(p)?.scrollIntoView({behavior:"smooth"})};return E("div",{className:"min-h-screen bg-[#000000] text-[#E5E5E5] selection:bg-[#FFFFFF] selection:text-[#000000] overflow-x-hidden",children:[w("
